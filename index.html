<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Island - Visor 3D</title>
  <!-- Librería oficial de Google Model-Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ededed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
    /* Barra superior de botones */
    .selector-bar {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.92);
      padding: 6px 10px;
      border-radius: 30px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      z-index: 100;
    }
    .btn {
      border: none;
      background: transparent;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn.active {
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Selector para alternar los modelos -->
  <div class="selector-bar">
    <button class="btn active" id="btn-v2" onclick="cambiarModelo('117%20KITCHEN%20ISLAND%20WRAPPED%20V2.glb', this)">Opción Wrapped (V2)</button>
    <button class="btn" id="btn-v1" onclick="cambiarModelo('117%20KITCHEN%20ISLAND%20WAINSCOATING%20V1GBL.glb', this)">Opción Wainscoating (V1)</button>
  </div>

  <!-- Visor 3D -->
  <model-viewer
    id="visor"
    src="117%20KITCHEN%20ISLAND%20WRAPPED%20V2.glb"
    alt="Kitchen Island"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1"
    shadow-softness="0.5"
    exposure="1">
  </model-viewer>

  <script>
    function cambiarModelo(archivo, boton) {
      const visor = document.getElementById('visor');
      visor.src = archivo;
      
      // Actualizar estilo de botones
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      boton.classList.add('active');
    }
  </script>

</body>
</html>
