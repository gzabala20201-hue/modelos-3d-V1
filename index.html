<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Island Wrapped V2 - Visor 3D</title>
  <!-- Librería oficial de Google Model-Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ededed;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <model-viewer
    src="117%20KITCHEN%20ISLAND%20WRAPPED%20V2.glb"
    alt="117 Kitchen Island Wrapped V2"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1"
    shadow-softness="0.5"
    exposure="1">
  </model-viewer>

</body>
</html>
